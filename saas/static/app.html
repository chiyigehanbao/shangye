<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作台 · FlowDesk 流序</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/static/style.css?v=5" />
<script>try{var t=localStorage.getItem('fd_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="/">
        <span class="mark"><svg viewBox="0 0 64 64" fill="none"><path d="M16 20h20a10 10 0 0 1 0 20H24" stroke="#05142a" stroke-width="7" stroke-linecap="round"/><path d="M16 44h12" stroke="#05142a" stroke-width="7" stroke-linecap="round"/></svg></span>
        <span>FlowDesk <small>流序 · 办公自动化</small></span>
      </a>
      <button class="workspace-pill w-full" id="wsSwitch" style="margin-top:14px;justify-content:space-between">
        <span class="row" style="gap:8px;flex-wrap:nowrap">
          <span class="avatar" id="wsAvatar">星</span>
          <span style="text-align:left;line-height:1.25">
            <span id="wsName" style="display:block;font-weight:700">工作区</span>
            <span id="wsRole" style="display:block;font-size:10px;color:var(--dim)">加载中</span>
          </span>
        </span>
        <span style="color:var(--dim);font-size:10px">▾</span>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">工作台</div>
      <a class="nav-item on" data-route="dashboard" href="#/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        总览
      </a>

      <div class="nav-group">自动化</div>
      <a class="nav-item" data-route="excel" href="#/excel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M9 9v11M15 9v11"/></svg>
        Excel 清洗
      </a>
      <a class="nav-item" data-route="docs" href="#/docs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><circle cx="11" cy="13" r="3"/><path d="M13.2 15.2 16 18"/></svg>
        文档抽取
      </a>
      <a class="nav-item" data-route="quotes" href="#/quotes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h4"/></svg>
        报价单
      </a>
      <a class="nav-item" data-route="analytics" href="#/analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16"/><rect x="8" y="11" width="3" height="5" rx="1"/><rect x="13" y="7" width="3" height="9" rx="1"/><rect x="18" y="13" width="3" height="3" rx="1"/></svg>
        销售看板
      </a>

      <div class="nav-group">账户</div>
      <a class="nav-item" data-route="billing" href="#/billing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/><path d="M6 15h4"/></svg>
        用量与计费
      </a>
      <a class="nav-item" data-route="settings" href="#/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        设置
      </a>
      <a class="nav-item hidden" data-route="admin" id="adminNav" href="#/admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
        平台管理
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="plan-card" id="planCard">
        <div class="t"><span>套餐</span><span class="badge gray">加载中</span></div>
        <div class="u"><span>本月任务</span><span>—</span></div>
        <div class="progress"><i></i></div>
        <a class="btn btn-sm btn-primary btn-block" href="#/billing">升级套餐</a>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-icon btn-ghost sidebar-toggle" id="sidebarToggle" aria-label="打开菜单">☰</button>
      <div>
        <div class="title" id="pageTitle">总览</div>
        <div class="crumb" id="pageCrumb">FlowDesk / 工作台</div>
      </div>
      <div class="spacer"></div>
      <button class="badge" id="aiBadge" title="AI 通道状态">AI</button>
      <button class="chip hide-sm" id="usagePill" title="本月任务用量">—</button>
      <button class="btn btn-icon btn-ghost" id="themeBtn" title="切换主题" aria-label="切换主题" data-theme-icon>☀</button>
      <div style="position:relative">
        <button class="avatar" id="avatarBtn" aria-label="用户菜单">?</button>
        <div class="menu hidden" id="userMenu" style="right:0;top:44px;min-width:230px">
          <div class="menu-label">当前账号</div>
          <div class="menu-item" style="cursor:default"><span class="avatar" id="menuAvatar">?</span><span><b id="menuName">—</b><br><span style="font-size:11px;color:var(--dim)" id="menuEmail">—</span></span></div>
          <div class="menu-sep"></div>
          <div class="menu-label">切换工作区</div>
          <div id="menuWorkspaces"></div>
          <div class="menu-sep"></div>
          <div class="menu-item" data-go="settings">账户与工作区设置</div>
          <div class="menu-item" data-go="billing">用量与计费</div>
          <div class="menu-sep"></div>
          <div class="menu-item danger" id="logoutBtn">退出登录</div>
        </div>
      </div>
    </header>

    <main class="content" id="view">
      <div class="spin-lg"></div>
    </main>
  </div>
</div>

<script src="/static/assets/common.js?v=5"></script>
<script src="/static/vendor/chart.umd.min.js?v=5"></script>
<script src="/static/assets/app.js?v=5"></script>
</body>
</html>
