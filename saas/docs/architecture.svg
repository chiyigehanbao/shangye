<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">FlowDesk 流序部署与模块架构</title>
  <desc id="desc">浏览器通过 Nginx 访问单进程 FastAPI，四个业务模块共享认证、配额、审计与 AI 路由，数据落在 SQLite WAL 和本地文件目录。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .title { font-size: 30px; font-weight: 750; fill: #111827; letter-spacing: .5px; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .layer { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .small { font-size: 12px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .card-title { font-size: 14px; font-weight: 700; fill: #1e293b; }
      .chip { font-size: 12px; font-weight: 600; fill: #3730a3; }
      .white { fill: #ffffff; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="790" fill="url(#bg)"/>
  <circle cx="1092" cy="66" r="120" fill="#e0e7ff" opacity=".55"/>
  <circle cx="90" cy="724" r="110" fill="#ede9fe" opacity=".5"/>

  <g class="t">
    <text x="56" y="58" class="title">FlowDesk 流序 · 部署与模块架构</text>
    <text x="58" y="84" class="subtitle">一个 FastAPI 单体进程，承载四个办公自动化模块；共享账号、配额、审计与 AI 降级链路。</text>

    <g filter="url(#shadow)">
      <rect x="918" y="40" width="224" height="52" rx="14" fill="#111827"/>
      <text x="1030" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#a5b4fc">TARGET</text>
      <text x="1030" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2C2G · 单进程部署</text>
    </g>

    <!-- Client -->
    <g filter="url(#shadow)">
      <rect x="56" y="112" width="1086" height="94" rx="18" fill="#ffffff"/>
    </g>
    <rect x="76" y="132" width="4" height="54" rx="2" fill="#6366f1"/>
    <text x="96" y="150" class="layer">客户端</text>
    <text x="96" y="171" class="tiny">零构建 SPA · 本地 Chart.js · 深浅主题 · 响应式</text>
    <g>
      <rect x="396" y="135" width="142" height="34" rx="17" fill="#eef2ff"/>
      <text x="467" y="157" text-anchor="middle" class="chip">落地页</text>
      <rect x="552" y="135" width="142" height="34" rx="17" fill="#eef2ff"/>
      <text x="623" y="157" text-anchor="middle" class="chip">工作台 SPA</text>
      <rect x="708" y="135" width="142" height="34" rx="17" fill="#eef2ff"/>
      <text x="779" y="157" text-anchor="middle" class="chip">登录 / 注册</text>
      <rect x="864" y="135" width="142" height="34" rx="17" fill="#eef2ff"/>
      <text x="935" y="157" text-anchor="middle" class="chip">打印 / 导出</text>
      <text x="396" y="190" class="tiny">浏览器只访问同源 API；所有依赖本地托管，无外部 CDN。</text>
    </g>

    <!-- Arrow client to nginx -->
    <line x1="599" y1="206" x2="599" y2="238" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Nginx -->
    <g filter="url(#shadow)">
      <rect x="56" y="242" width="1086" height="92" rx="18" fill="#111827"/>
    </g>
    <text x="84" y="275" font-size="16" font-weight="750" fill="#ffffff">Nginx</text>
    <text x="84" y="298" font-size="12" fill="#a5b4fc">反向代理 · TLS · gzip · 20MB 上传限制 · 静态资源直出</text>
    <g>
      <rect x="586" y="260" width="154" height="28" rx="14" fill="#1f2937" stroke="#374151"/>
      <text x="663" y="279" text-anchor="middle" class="tiny" fill="#cbd5e1">/ → FastAPI</text>
      <rect x="754" y="260" width="154" height="28" rx="14" fill="#1f2937" stroke="#374151"/>
      <text x="831" y="279" text-anchor="middle" class="tiny" fill="#cbd5e1">/static/ → 文件</text>
      <rect x="922" y="260" width="180" height="28" rx="14" fill="#1f2937" stroke="#374151"/>
      <text x="1012" y="279" text-anchor="middle" class="tiny" fill="#cbd5e1">/api/health → app</text>
    </g>
    <text x="586" y="316" class="tiny" fill="#94a3b8">只有 Nginx 暴露 80/443，应用端口不映射到宿主机。</text>

    <!-- Arrow nginx to app -->
    <line x1="599" y1="334" x2="599" y2="368" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- FastAPI shell -->
    <g filter="url(#shadow)">
      <rect x="56" y="372" width="1086" height="254" rx="20" fill="url(#app)" stroke="#c7d2fe"/>
    </g>
    <rect x="56" y="372" width="1086" height="48" rx="20" fill="url(#brand)"/>
    <rect x="56" y="396" width="1086" height="24" fill="url(#brand)"/>
    <text x="84" y="401" font-size="16" font-weight="750" fill="#ffffff">FastAPI · uvicorn --workers 1</text>
    <text x="938" y="401" font-size="11" fill="#ddd6fe">单进程 · 内存会话 · SQLite WAL</text>

    <!-- Access -->
    <rect x="80" y="440" width="246" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="98" y="466" class="card-title">接入与平台能力</text>
    <text x="98" y="491" class="small">· 登录 / 会话 / RBAC</text>
    <text x="98" y="513" class="small">· 工作区与成员邀请</text>
    <text x="98" y="535" class="small">· 套餐 / 配额 / 计量</text>
    <text x="98" y="557" class="small">· 审计日志 / 平台后台</text>
    <text x="98" y="583" class="mono">PBKDF2 · HttpOnly · opacity</text>

    <!-- Modules -->
    <rect x="344" y="440" width="380" height="160" rx="14" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="362" y="466" class="card-title">四个业务模块（共享上下文）</text>
    <g>
      <rect x="362" y="480" width="166" height="46" rx="10" fill="#eef2ff"/>
      <text x="445" y="500" text-anchor="middle" class="chip">Excel 清洗</text>
      <text x="445" y="516" text-anchor="middle" class="tiny">清洗 · 汇总 · 导出</text>

      <rect x="540" y="480" width="166" height="46" rx="10" fill="#ecfeff"/>
      <text x="623" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#0e7490">文档抽取</text>
      <text x="623" y="516" text-anchor="middle" class="tiny">批量队列 · 重试</text>

      <rect x="362" y="536" width="166" height="46" rx="10" fill="#f0fdf4"/>
      <text x="445" y="556" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">报价单</text>
      <text x="445" y="572" text-anchor="middle" class="tiny">条目 · 税折 · 打印</text>

      <rect x="540" y="536" width="166" height="46" rx="10" fill="#fff7ed"/>
      <text x="623" y="556" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">销售看板</text>
      <text x="623" y="572" text-anchor="middle" class="tiny">KPI · 趋势 · 洞察</text>
    </g>

    <!-- AI -->
    <rect x="742" y="440" width="184" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="760" y="466" class="card-title">AI 三层降级</text>
    <g>
      <rect x="760" y="480" width="148" height="28" rx="8" fill="#eef2ff"/>
      <text x="834" y="499" text-anchor="middle" class="tiny">1 · 云 API</text>
      <rect x="760" y="514" width="148" height="28" rx="8" fill="#ecfeff"/>
      <text x="834" y="533" text-anchor="middle" class="tiny">2 · 本地 Ollama</text>
      <rect x="760" y="548" width="148" height="28" rx="8" fill="#f0fdf4"/>
      <text x="834" y="567" text-anchor="middle" class="tiny">3 · 确定性规则</text>
    </g>
    <text x="760" y="590" class="tiny">每次结果标注 provider</text>

    <!-- Worker -->
    <rect x="944" y="440" width="174" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="962" y="466" class="card-title">异步任务</text>
    <text x="962" y="491" class="small">文档 worker 线程</text>
    <text x="962" y="513" class="small">SQLite 任务队列</text>
    <text x="962" y="535" class="small">优先级 / 重试 / 取消</text>
    <text x="962" y="557" class="small">断点续跑</text>
    <text x="962" y="583" class="mono">2C2G: workers=1</text>

    <!-- Arrow app to data -->
    <line x1="599" y1="626" x2="599" y2="660" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Data -->
    <g filter="url(#shadow)">
      <rect x="56" y="664" width="1086" height="88" rx="18" fill="#0f172a"/>
    </g>
    <text x="84" y="696" font-size="15" font-weight="750" fill="#ffffff">数据层</text>
    <text x="84" y="718" font-size="11" fill="#94a3b8">单机 · 易备份 · 可迁移</text>
    <g>
      <rect x="274" y="684" width="250" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="399" y="705" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">SQLite · WAL</text>
      <text x="399" y="722" text-anchor="middle" class="tiny" fill="#94a3b8">业务 / 会话 / 任务 / 审计</text>

      <rect x="546" y="684" width="238" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="665" y="705" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">data/uploads</text>
      <text x="665" y="722" text-anchor="middle" class="tiny" fill="#94a3b8">原始文档 · SHA-256 去重</text>

      <rect x="806" y="684" width="220" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="916" y="705" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">backups</text>
      <text x="916" y="722" text-anchor="middle" class="tiny" fill="#94a3b8">sqlite3 backup API</text>

      <rect x="1046" y="684" width="72" height="50" rx="12" fill="#312e81"/>
      <text x="1082" y="705" text-anchor="middle" font-size="11" font-weight="700" fill="#c7d2fe">Docker</text>
      <text x="1082" y="721" text-anchor="middle" font-size="10" fill="#a5b4fc">Volume</text>
    </g>
  </g>
</svg>
