services:
  app:
    build: .
    container_name: flowdesk-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/flowdesk.db
    volumes:
      - ./data:/app/data
      - ./static:/app/static:ro
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1500m
    cpus: 1.8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    container_name: flowdesk-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/srv/static:ro
    mem_limit: 128m
